<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 托盘专用图标：与应用图标同一图案，但铺满整个方块、节点和连线加粗，
       缩到 16～24 像素的托盘尺寸时仍然饱满清晰。右下角留给状态圆点 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="76" stroke-linecap="round">
    <line x1="280" y1="280" x2="744" y2="280"/>
    <line x1="280" y1="280" x2="280" y2="744"/>
    <line x1="744" y1="280" x2="744" y2="744"/>
    <line x1="280" y1="744" x2="744" y2="744"/>
    <line x1="280" y1="280" x2="744" y2="744"/>
  </g>
  <g fill="#ffffff">
    <circle cx="280" cy="280" r="128"/>
    <circle cx="744" cy="280" r="128"/>
    <circle cx="280" cy="744" r="128"/>
    <circle cx="744" cy="744" r="128"/>
  </g>
</svg>
