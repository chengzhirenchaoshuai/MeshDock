[package]
name = "meshdock"
version = "0.5.0"
description = "自建 Headscale 组网的中文图形客户端"
authors = []
edition = "2024"

[lib]
# 库名加 _lib 后缀，避免在 Windows 上与可执行文件同名冲突（cargo#8519）
name = "meshdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# 发布版体积优化，参见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
