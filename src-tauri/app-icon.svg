  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="44" stroke-linecap="round">
    <line x1="312" y1="312" x2="712" y2="312"/>
    <line x1="312" y1="312" x2="312" y2="712"/>
    <line x1="712" y1="312" x2="712" y2="712"/>
    <line x1="312" y1="712" x2="712" y2="712"/>
